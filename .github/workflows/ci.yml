name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml

      # Formatting (Spotless), tests and, from later tickets, Testcontainers
      # tests against the Docker daemon that ubuntu-latest provides.
      - run: ./mvnw -B verify
