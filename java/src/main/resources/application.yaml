spring:
  application:
    name: time-deposit-kata
  flyway:
    # Schema only. The local profile adds the seed data location (see application-local.yaml).
    locations: classpath:db/migration
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # UPDATEs go out in primary-key order, so concurrent Balance Updates lock rows in the same order and cannot
        # deadlock: the later one waits, then fails its optimistic version check (409).
        order_updates: true
springdoc:
  swagger-ui:
    # Swagger UI shows the contract as written (copied to static/ at build time, see pom.xml), not the spec springdoc
    # derives from the code at /v3/api-docs. springdoc only serves Swagger UI while its api-docs are enabled.
    url: /openapi.yaml
server:
  mime-mappings:
    yaml: application/yaml
management:
  # Tracing is used only to correlate log lines; nothing is sent to an OpenTelemetry collector.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
