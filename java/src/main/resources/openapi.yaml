openapi: 3.0.3
info:
  title: XA Bank Time Deposits API
  version: 1.0.0
  description: |
    Time Deposits of XA Bank, with their Withdrawals.
    Errors are RFC 9457 Problem Details (`application/problem+json`).
tags:
  - name: Time Deposits
paths:
  /time-deposits:
    get:
      tags: [Time Deposits]
      operationId: getTimeDeposits
      summary: List Time Deposits, a page at a time
      description: |
        Returns a page of Time Deposits ordered by `id` ascending.
        Each Time Deposit carries all of its Withdrawals; Withdrawals are not paginated.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of Time Deposits per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of Time Deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /time-deposits/balance-updates:
    post:
      tags: [Time Deposits]
      operationId: applyBalanceUpdate
      summary: Run a Balance Update
      description: |
        Adds one Monthly Interest to the Balance of every Time Deposit, all or nothing.
        Every call adds another month of interest; calling it once a month is the caller's job.
        Days is not changed.

        To retry safely, send an `Idempotency-Key`. The first call with a key runs the Balance Update and stores
        the key with it; a later call with the same key returns `204` and adds no interest. A call that fails
        stores no key, so it can be retried with the same key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            A unique value per intended Balance Update, for example a UUID such as
            `8e03978e-40d5-43e8-bc93-6894a57f9324`. Up to 255 letters, digits and `._:+/=-`, bare or in double
            quotes (the Structured Field string form of the IETF Idempotency-Key draft); `"abc"` and `abc` are the
            same key. Keys never expire. Leave it empty and every call adds interest.
          # Assumption (ticket 11): up to 255 characters from a restricted set, so the key is safe to log; any other
          # value is a 400 and adds no interest. The quoted form is accepted because the IETF draft defines the header
          # as a Structured Field string.
          schema:
            type: string
            pattern: '^([A-Za-z0-9._:+/=-]{1,255}|"[A-Za-z0-9._:+/=-]{1,255}")$'
          # No example or default, here or on the schema (ticket 11): Swagger UI copies either into the field on Try it
          # out, and a fixed key would make every POST from Swagger UI after the first a replay that adds no interest.
      responses:
        '204':
          description: |
            The Balance Update was applied to every Time Deposit, or an earlier call with the same
            `Idempotency-Key` already applied it.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            A concurrent Balance Update changed a Time Deposit first. This one was rolled back as a whole and
            applied no interest; the one that won applied the month's interest.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  responses:
    BadRequest:
      description: A request parameter is missing, malformed or out of range.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TimeDepositPage:
      type: object
      description: One page of Time Deposits.
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeDeposit'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Number of Time Deposits across all pages.
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Number of pages of the requested size.
          example: 1
    TimeDeposit:
      type: object
      description: Money a customer holds with the bank under one Plan Type.
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          # Assumption (ticket 5): a plain string, not an enum. A Time Deposit with an unknown Plan Type is bad data
          # the API still returns.
          type: string
          description: |
            The Plan Type of the Time Deposit. Known values: `basic`, `student`, `premium`.
            Any other value is bad data, returned as stored.
          example: basic
        balance:
          type: number
          description: Current Balance with two decimals, net of any Withdrawals.
          example: 1234.56
        days:
          type: integer
          format: int32
          description: Age of the Time Deposit in days since it was opened.
          example: 45
        withdrawals:
          type: array
          description: All Withdrawals of the Time Deposit, ordered by `id`. Empty when there are none.
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      description: An amount taken out of a Time Deposit on a given date.
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          description: Amount withdrawn, with two decimals.
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence.
      additionalProperties: true
