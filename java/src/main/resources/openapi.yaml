openapi: 3.0.3
info:
  title: XA Bank Time Deposits API
  version: 1.0.0
  description: |
    Time Deposits of XA Bank, with their Withdrawals.
    Errors are RFC 9457 Problem Details (`application/problem+json`).
tags:
  - name: Time Deposits
paths:
  /v1/time-deposits:
    get:
      tags: [Time Deposits]
      operationId: getTimeDeposits
      summary: List Time Deposits, a page at a time
      description: |
        Returns a page of Time Deposits ordered by `id` ascending.
        Each Time Deposit carries all of its Withdrawals; Withdrawals are not paginated.
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of Time Deposits per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of Time Deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /time-deposits/balance-updates:
    post:
      tags: [Time Deposits]
      operationId: applyBalanceUpdate
      summary: Run a Balance Update
      description: |
        Adds one Monthly Interest to the Balance of every Time Deposit, all or nothing.
        Every call adds another month of interest; calling it once a month is the caller's job.
        Days is not changed.
      responses:
        '204':
          description: The Balance Update was applied to every Time Deposit.
        '409':
          description: |
            A concurrent Balance Update changed a Time Deposit first. This one was rolled back as a whole and
            applied no interest; the one that won applied the month's interest.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  responses:
    BadRequest:
      description: A request parameter is missing, malformed or out of range.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TimeDepositPage:
      type: object
      description: One page of Time Deposits.
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeDeposit'
        page:
          type: integer
          format: int32
          description: Zero-based index of this page.
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        totalItems:
          type: integer
          format: int64
          description: Number of Time Deposits across all pages.
          example: 1
        totalPages:
          type: integer
          format: int32
          description: Number of pages of the requested size.
          example: 1
    TimeDeposit:
      type: object
      description: Money a customer holds with the bank under one Plan Type.
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: |
            The Plan Type of the Time Deposit. Known values: `basic`, `student`, `premium`.
            Any other value is bad data, returned as stored.
          example: basic
        balance:
          type: number
          description: Current Balance with two decimals, net of any Withdrawals.
          example: 1234.56
        days:
          type: integer
          format: int32
          description: Age of the Time Deposit in days since it was opened.
          example: 45
        withdrawals:
          type: array
          description: All Withdrawals of the Time Deposit, ordered by `id`. Empty when there are none.
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      description: An amount taken out of a Time Deposit on a given date.
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          description: Amount withdrawn, with two decimals.
          example: 100.00
        date:
          type: string
          format: date
          example: '2026-01-15'
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence.
      additionalProperties: true
